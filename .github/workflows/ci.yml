name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        # alembic.ini and pytest.ini both use paths relative to backend/,
        # so the rootdir has to be pinned to that directory.
        run: python -m pytest -c backend/pytest.ini --rootdir backend backend/tests

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: weshare
          POSTGRES_PASSWORD: weshare
          POSTGRES_DB: weshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py uses this when it is set, and always points the suite at a
      # throwaway database instead of the development one.
      TEST_DATABASE_URL: postgresql+psycopg://weshare:weshare@127.0.0.1:5432/weshare_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -c backend/pytest.ini --rootdir backend backend/tests

  frontend:
    name: Frontend tests and build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: No credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that no environment file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "::error::An environment file is committed. Remove it and rotate the credentials." >&2
            exit 1
          fi
          echo "No .env file is tracked."

      - name: Check the history for common secret patterns
        run: |
          set -euo pipefail
          if git log -p --all | grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'; then
            echo "::error::A credential pattern was found in the git history." >&2
            exit 1
          fi
          echo "No credential patterns found in the history."
